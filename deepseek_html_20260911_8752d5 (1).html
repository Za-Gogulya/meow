<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ежедневный рандомайзер</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .app {
      width: 100%;
      max-width: 640px;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 16px; font-size: 24px; }

    .meta {
      display: flex; justify-content: space-between; gap: 12px;
      flex-wrap: wrap; font-size: 14px; color: #4b5563;
      margin-bottom: 16px;
    }

    .toolbar {
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap; margin-bottom: 16px;
      padding: 12px; background: #f9fafb; border-radius: 12px;
    }
    .toolbar-label { font-size: 14px; color: #4b5563; }
    .palette { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatch {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
      transition: transform .1s, border-color .15s;
      padding: 0;
    }
    .swatch:hover { transform: scale(1.1); }
    .swatch.active { border-color: #111827; transform: scale(1.1); }

    .progress-wrap {
      height: 10px; background: #e5e7eb; border-radius: 999px;
      overflow: hidden; margin-bottom: 6px;
    }
    .progress-bar {
      height: 100%; width: 0%; background: #22c55e;
      transition: width .25s ease;
    }
    .progress-text { font-size: 14px; color: #4b5563; margin-bottom: 16px; }

    .list { list-style: none; padding: 0; margin: 0 0 8px; }
    .item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 10px; border-radius: 10px;
      cursor: pointer; user-select: none;
      transition: background .15s;
      border-bottom: 1px solid #eef0f3;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #f9fafb; }

    .item input[type="checkbox"] {
      width: 20px; height: 20px;
      cursor: pointer;
      flex-shrink: 0;
      /* accent-color подставим inline — он и даст цвет галочки */
    }

    .item .text { flex: 1; transition: color .15s; }
    .item.checked .text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .mark-dot {
      width: 14px; height: 14px; border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
      flex-shrink: 0;
    }
    .mark-empty {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px dashed #d1d5db;
      flex-shrink: 0;
    }

    .hint { font-size: 13px; color: #6b7280; line-height: 1.5; margin: 12px 0 0; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Ежедневные 10 вариантов</h1>

    <div class="meta">
      <div>День: <strong id="dayKey">—</strong></div>
      <div>До обновления: <strong id="countdown">—</strong></div>
    </div>

    <div class="toolbar">
      <span class="toolbar-label">Цвет галочки:</span>
      <div class="palette" id="palette"></div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">Загрузка…</div>

    <ul id="list" class="list"></ul>

    <p class="hint">
      Выберите цвет, затем кликните по строке — появится галочка этого цвета.
      Клик другим цветом перекрасит галочку, клик тем же цветом — снимет отметку.
      Отметки сохраняются в этом браузере.
    </p>
  </div>

  <script>
    // ===================== НАСТРОЙКИ =====================
    const RESET_HOUR = 9;
    const RESET_MINUTE = 0;
    const COUNT = 10;

    const PALETTE = [
      '#22c55e', // зелёный
      '#3b82f6', // синий
      '#f59e0b', // янтарный
      '#ef4444', // красный
      '#a855f7', // фиолетовый
      '#ec4899', // розовый
      '#14b8a6', // бирюзовый
      '#6b7280'  // серый
    ];

    // Большой список, из которого каждый день случайно выбираются 10 пунктов
    const POOL = [
      "Пункт 1",  "Пункт 2",  "Пункт 3",  "Пункт 4",  "Пункт 5",
      "Пункт 6",  "Пункт 7",  "Пункт 8",  "Пункт 9",  "Пункт 10",
      "Пункт 11", "Пункт 12", "Пункт 13", "Пункт 14", "Пункт 15",
      "Пункт 16", "Пункт 17", "Пункт 18", "Пункт 19", "Пункт 20",
      "Пункт 21", "Пункт 22", "Пункт 23", "Пункт 24", "Пункт 25",
      "Пункт 26", "Пункт 27", "Пункт 28", "Пункт 29", "Пункт 30",
      "Пункт 31", "Пункт 32", "Пункт 33", "Пункт 34", "Пункт 35",
      "Пункт 36", "Пункт 37", "Пункт 38", "Пункт 39", "Пункт 40"
    ];

    // ===================== УТИЛИТЫ =====================
    function getDayKey(date = new Date()) {
      const d = new Date(date);
      const beforeReset =
        d.getHours() < RESET_HOUR ||
        (d.getHours() === RESET_HOUR && d.getMinutes() < RESET_MINUTE);
      if (beforeReset) d.setDate(d.getDate() - 1);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getNextReset(now = new Date()) {
      const next = new Date(now);
      next.setHours(RESET_HOUR, RESET_MINUTE, 0, 0);
      if (next <= now) next.setDate(next.getDate() + 1);
      return next;
    }

    function hashString(str) {
      let h = 1779033703 ^ str.length;
      for (let i = 0; i < str.length; i++) {
        h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
        h = (h << 13) | (h >>> 19);
      }
      return function () {
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return (h ^= h >>> 16) >>> 0;
      };
    }
    function mulberry32(a) {
      return function () {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function shuffle(arr, rng) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function generateItems(dayKey) {
      const rng = mulberry32(hashString(dayKey)());
      const shuffled = shuffle(POOL, rng);
      return shuffled.slice(0, Math.min(COUNT, shuffled.length)).map((text, i) => ({
        id: i,
        text
      }));
    }

    function storageKey(dayKey) {
      return `daily-random-checked-${dayKey}`;
    }
    function loadMarks(dayKey) {
      try {
        return JSON.parse(localStorage.getItem(storageKey(dayKey))) || {};
      } catch {
        return {};
      }
    }
    function saveMarks(dayKey, marks) {
      localStorage.setItem(storageKey(dayKey), JSON.stringify(marks));
    }

    // ===================== СОСТОЯНИЕ =====================
    let currentDayKey = null;
    let currentItems = [];
    let currentMarks = {}; // { [itemId]: color }

    let myColor = localStorage.getItem('daily-random-my-color') || PALETTE[0];
    if (!PALETTE.includes(myColor)) myColor = PALETTE[0];

    // ===================== РЕНДЕР =====================
    const listEl = document.getElementById('list');
    const paletteEl = document.getElementById('palette');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const dayKeyEl = document.getElementById('dayKey');
    const countdownEl = document.getElementById('countdown');

    function renderPalette() {
      paletteEl.innerHTML = '';
      PALETTE.forEach(color => {
        const btn = document.createElement('button');
        btn.className = 'swatch' + (color === myColor ? ' active' : '');
        btn.style.background = color;
        btn.title = color;
        btn.addEventListener('click', () => {
          myColor = color;
          localStorage.setItem('daily-random-my-color', color);
          renderPalette();
        });
        paletteEl.appendChild(btn);
      });
    }

    function renderList() {
      listEl.innerHTML = '';
      currentItems.forEach(item => {
        const color = currentMarks[item.id];

        const li = document.createElement('li');
        li.className = 'item' + (color ? ' checked' : '');

        const label = document.createElement('label');
        label.style.display = 'flex';
        label.style.alignItems = 'center';
        label.style.gap = '12px';
        label.style.flex = '1';
        label.style.cursor = 'pointer';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = !!color;
        // accent-color красит именно галочку и фон чекбокса
        checkbox.style.accentColor = color || myColor;

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = item.text;

        const indicator = document.createElement('span');
        if (color) {
          indicator.className = 'mark-dot';
          indicator.style.background = color;
        } else {
          indicator.className = 'mark-empty';
        }

        label.appendChild(checkbox);
        label.appendChild(text);
        li.appendChild(label);
        li.appendChild(indicator);

        // клик по любому месту строки = клик по логике
        li.addEventListener('click', (e) => {
          // если клик пришёл от самого чекбокса, он всё равно переключит,
          // поэтому обрабатываем единообразно и предотвращаем двойное срабатывание
          e.preventDefault();
          toggleMark(item.id);
        });

        listEl.appendChild(li);
      });
    }

    function renderProgress() {
      const total = currentItems.length;
      const solved = currentItems.filter(i => currentMarks[i.id]).length;
      const percent = total ? (solved / total) * 100 : 0;
      progressBar.style.width = percent + '%';
      progressText.textContent = `Отмечено: ${solved} из ${total}`;
    }

    function renderAll() {
      dayKeyEl.textContent = currentDayKey || '—';
      renderList();
      renderProgress();
    }

    // ===================== ДЕЙСТВИЯ =====================
    function toggleMark(itemId) {
      const existing = currentMarks[itemId];
      if (!existing) {
        currentMarks[itemId] = myColor;
      } else if (existing === myColor) {
        delete currentMarks[itemId];
      } else {
        currentMarks[itemId] = myColor;
      }
      saveMarks(currentDayKey, currentMarks);
      renderList();
      renderProgress();
    }

    // ===================== ЗАГРУЗКА ДНЯ =====================
    function refreshDay() {
      const dayKey = getDayKey();
      if (dayKey !== currentDayKey) {
        currentDayKey = dayKey;
        currentItems = generateItems(dayKey);
        currentMarks = loadMarks(dayKey);
        renderAll();
      }
    }

    // ===================== ТАЙМЕР =====================
    function updateCountdown() {
      const now = new Date();
      const next = getNextReset(now);
      const diff = next - now;
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      countdownEl.textContent =
        `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    // ===================== СТАРТ =====================
    renderPalette();
    refreshDay();
    updateCountdown();

    setInterval(() => {
      updateCountdown();
      refreshDay();
    }, 1000);
  </script>
</body>
</html>
